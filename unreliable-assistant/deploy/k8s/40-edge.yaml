# NGINX edge in front of the stateless API pool. Keep-alive upstream connections, per-IP connection cap, 429 passthrough (the API's
# designed overload answer must reach the client unchanged), and no buffering so streamed answers (SSE) are delivered as they are produced.
apiVersion: v1
kind: ConfigMap
metadata: {name: nginx-conf, namespace: assistant}
data:
  nginx.conf: |
    worker_processes auto;
    worker_rlimit_nofile 200000;
    events { worker_connections 65536; multi_accept on; }
    http {
      upstream api { zone api 64k; least_conn; server api.assistant.svc:8080 max_fails=0; keepalive 2048; keepalive_requests 10000; }
      limit_conn_zone $binary_remote_addr zone=perip:20m;
      server {
        listen 80 reuseport;
        client_max_body_size 32k;
        location /healthz { access_log off; proxy_pass http://api; }
        location / {
          limit_conn perip 200;
          proxy_http_version 1.1; proxy_set_header Connection "";
          proxy_set_header X-Request-Id $request_id;
          proxy_set_header traceparent $http_traceparent;
          proxy_buffering off; proxy_read_timeout 5s; proxy_connect_timeout 1s;
          proxy_next_upstream error timeout; proxy_next_upstream_tries 2;
          proxy_pass http://api;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: edge, namespace: assistant}
spec:
  replicas: 3
  selector: {matchLabels: {app: edge}}
  template:
    metadata: {labels: {app: edge}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports: [{containerPort: 80}]
          volumeMounts: [{name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf}]
          resources: {requests: {cpu: "2", memory: 1Gi}}
      volumes: [{name: conf, configMap: {name: nginx-conf}}]
---
apiVersion: v1
kind: Service
metadata: {name: edge, namespace: assistant}
spec: {type: LoadBalancer, selector: {app: edge}, ports: [{port: 443, targetPort: 80}]}
