# Stateless FastAPI workers. State lives in Postgres/Redis, so any replica can serve any request.
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: assistant}
spec:
  replicas: 6
  strategy: {rollingUpdate: {maxUnavailable: 0, maxSurge: 25%}}
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: api
          image: registry.example.com/unreliable-assistant:latest   # set by CI to the built digest
          ports: [{containerPort: 8080}]
          envFrom:
            - configMapRef: {name: assistant-config}
            - secretRef: {name: assistant-secrets}
          resources: {requests: {cpu: "2", memory: 3Gi}, limits: {cpu: "4", memory: 4Gi}}
          # /healthz never depends on bulkhead state or databases (design Gate 9): a saturated pod is not restarted for being busy.
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10, failureThreshold: 3}
          # /readyz gates traffic on warm-up and real dependency health.
          readinessProbe: {httpGet: {path: /readyz, port: 8080}, periodSeconds: 5, failureThreshold: 2}
          startupProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 5, failureThreshold: 30}
          lifecycle: {preStop: {exec: {command: ["sleep", "10"]}}}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: assistant}
spec: {selector: {app: api}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api, namespace: assistant}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 6
  maxReplicas: 120
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 55}}
  behavior:
    scaleUp: {stabilizationWindowSeconds: 0, policies: [{type: Percent, value: 100, periodSeconds: 30}]}
    scaleDown: {stabilizationWindowSeconds: 300}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api, namespace: assistant}
spec: {minAvailable: 80%, selector: {matchLabels: {app: api}}}
