# ONNX embedding + rerank workers with dynamic micro-batching (batch 32, max_wait 8 ms) - see app/microbatch.py.
apiVersion: apps/v1
kind: Deployment
metadata: {name: model-worker, namespace: assistant}
spec:
  replicas: 4
  selector: {matchLabels: {app: model-worker}}
  template:
    metadata: {labels: {app: model-worker}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: worker
          image: registry.example.com/unreliable-assistant:latest
          command: ["uv", "run", "uvicorn", "mcp_servers.model_worker:app", "--host", "0.0.0.0", "--port", "8090"]
          ports: [{containerPort: 8090}]
          envFrom: [{configMapRef: {name: assistant-config}}]
          resources:
            requests: {cpu: "4", memory: 4Gi}
            limits: {cpu: "4", memory: 6Gi}     # add nvidia.com/gpu: 1 and an ONNX CUDA provider image to serve from GPU
          readinessProbe: {httpGet: {path: /healthz, port: 8090}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: model-worker, namespace: assistant}
spec: {selector: {app: model-worker}, ports: [{port: 8090}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: model-worker, namespace: assistant}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: model-worker}
  minReplicas: 4
  maxReplicas: 80
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
