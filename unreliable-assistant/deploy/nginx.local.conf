worker_processes auto;
worker_rlimit_nofile 200000;
events { worker_connections 65536; multi_accept on; }
http {
  upstream api { zone api 64k; least_conn; server api:8080 max_fails=0; keepalive 2048; keepalive_requests 10000; }
  limit_conn_zone $binary_remote_addr zone=perip:20m;
  server {
    listen 80 reuseport;
    client_max_body_size 32k;
    location /healthz { access_log off; proxy_pass http://api; }
    location / {
      limit_conn perip 200;
      proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header traceparent $http_traceparent;
      proxy_buffering off; proxy_read_timeout 5s; proxy_connect_timeout 1s;
      proxy_next_upstream error timeout; proxy_next_upstream_tries 2;
      proxy_pass http://api;
    }
  }
}

